name: Pubblicazione su GitHub Pages

on:
  push:
    # Il branch di default del repository e' `claude/tech-offers-hub-mobile-0h4fnw`:
    # `main` non esiste. E' elencato lo stesso perche' se un giorno il branch
    # viene rinominato secondo la convenzione piu' comune, il workflow continua
    # a funzionare senza modifiche.
    branches:
      - claude/tech-offers-hub-mobile-0h4fnw
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # L'app è statica: si pubblica la radice del repository così com'è.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
