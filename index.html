<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tech Offers Hub — Offerte PC fissi e portatili</title>
  <meta name="description" content="Le migliori offerte del giorno su PC fissi e notebook dai principali negozi di tecnologia italiani, ordinate per sconto e filtrabili per specifiche tecniche.">
  <meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0f1d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="web/manifest.webmanifest">
  <link rel="icon" href="web/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="web/assets/icons/icon-180.png">
  <link rel="stylesheet" href="web/assets/css/style.css">
</head>
<body>

  <p id="disclaimer" class="disclaimer-bar hidden"></p>

  <!-- ============================ SCELTA CATEGORIA ======================= -->
  <main id="screen-home" class="screen home is-active">
    <div class="home__brand">
      <span class="home__mark" aria-hidden="true"></span>
      <h1 class="home__title">Tech Offers Hub</h1>
    </div>

    <p class="home__lede">Le offerte PC di oggi, <em>in ordine di sconto</em>.</p>

    <div class="picker">
      <button class="picker__card picker__card--desktop" type="button" data-category-card="desktop">
        <span class="picker__icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6h6M9 10h6M12 17.5v.01"/></svg>
        </span>
        <span class="picker__name">PC fissi</span>
        <span class="picker__desc">Tower, mini PC e all-in-one</span>
        <span class="picker__stats">
          <span class="picker__stat"><b data-stat-count>—</b><span>offerte</span></span>
          <span class="picker__stat"><b data-stat-best>—</b><span>sconto max</span></span>
        </span>
      </button>

      <button class="picker__card picker__card--laptop" type="button" data-category-card="laptop">
        <span class="picker__icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M1.5 20h21"/></svg>
        </span>
        <span class="picker__name">Portatili</span>
        <span class="picker__desc">Notebook, ultrabook e gaming</span>
        <span class="picker__stats">
          <span class="picker__stat"><b data-stat-count>—</b><span>offerte</span></span>
          <span class="picker__stat"><b data-stat-best>—</b><span>sconto max</span></span>
        </span>
      </button>
    </div>

    <p class="home__foot">
      Prezzi raccolti dai principali negozi di tecnologia italiani.<br>
      Ultimo aggiornamento: <strong data-generated>—</strong>.
    </p>
  </main>

  <!-- ================================ LISTA ============================== -->
  <div id="screen-list" class="screen">
    <header class="topbar">
      <div class="topbar__row">
        <button class="iconbtn" type="button" data-action="back" aria-label="Torna alle categorie">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="topbar__heading">
          <span class="topbar__eyebrow" id="topbar-eyebrow">Offerte del giorno</span>
          <h2 class="topbar__title" id="topbar-title">Portatili</h2>
        </div>
      </div>

      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label class="sr-only" for="search-input">Cerca fra le offerte</label>
        <input id="search-input" type="search" inputmode="search" autocomplete="off"
               placeholder="Cerca modello, marca, RTX 4060…">
        <button id="search-clear" class="search__clear hidden" type="button" aria-label="Cancella la ricerca">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="toolbar">
        <button class="chip" type="button" data-action="open-filters">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
          Filtri
          <span class="chip__count hidden" id="filter-count"></span>
        </button>
        <button class="chip" type="button" data-action="open-sort">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h10M4 16h6M17 5v14M17 19l3-3M17 19l-3-3"/></svg>
          <span id="sort-label">Sconto maggiore</span>
        </button>
      </div>
    </header>

    <main class="results">
      <div class="results__meta">
        <span id="results-count">—</span>
      </div>
      <div class="cards" id="cards"></div>
    </main>
  </div>

  <!-- ============================ PANNELLO A SCOMPARSA =================== -->
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
    <div id="sheet-scrim" class="sheet__scrim"></div>
    <div class="sheet__panel">
      <span class="sheet__grip" aria-hidden="true"></span>
      <div class="sheet__head">
        <h2 id="sheet-title">Filtri</h2>
        <button id="sheet-close" class="iconbtn" type="button" aria-label="Chiudi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="sheet-body" class="sheet__body"></div>
      <div id="sheet-foot" class="sheet__foot hidden"></div>
    </div>
  </div>

  <script type="module" src="web/assets/js/app.js"></script>
</body>
</html>
